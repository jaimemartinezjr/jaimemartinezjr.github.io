<header class="site-header">
  <div class="shell header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Jaime Martinez Jr. home">
      <span class="wordmark-mark" aria-hidden="true">JM</span>
      <span class="wordmark-name">Jaime Martinez Jr.</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">Toggle navigation</span>
      <span aria-hidden="true">Menu</span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
      {% assign nav_items = "About|about,Experience|experience,Contact|contact" | split: "," %}
      {% for item in nav_items %}
        {% assign parts = item | split: "|" %}
        <a class="{% if page.url contains parts[1] %}is-active{% endif %}" href="{{ '/' | append: parts[1] | append: '/' | relative_url }}">{{ parts[0] }}</a>
      {% endfor %}
      <a class="nav-email" href="mailto:{{ site.email }}">Get in touch <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
